<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }
        table {
        border: 2px solid #0c0c0c;
        border-collapse: collapse;
        width:61%;
        margin: auto;
        }
         td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            border: 1px solid #130101;
            padding-top: 10px;
            padding-bottom: 8px;
            text-align: left;
            background-color: gray;
            color: white;
            padding-left: 8px;
            padding-right: 8px;
        }
        .DOB-column {
            color:#15d797;
            width: 150px;
        }
        /* github copilot*/
        </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>DOB</th>
                <th>Gender</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>john.doe@example.com</td>
                <td>1990-01-01</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>Smith</td>
                <td>jane.smith@example.com</td>
                <td>1992-05-15</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>Michael</td>
                <td>Johnson</td>
                <td>michael.johnson@example.com</td>
                <td>1985-09-20</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>kate</td>
                <td>william</td>
                <td>kate.william@example.com</td>
                <td>1996-03-10</td>
                <td>Female</td>
                
        </tbody>
    </table>
</body>
</html>
