<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Slabo+13px&display=swap" rel="stylesheet">
    <style>
        body{
            background:#f8f8f8;
             font-family: "Slabo 13px", serif;
             font-weight:400;
             font-style:normal;
        }
        form{
            width: 28%;
            margin: auto;
            background: #fff;
            padding: 16px;
            border: 1px solid #086288;
        }
        label{
            color: #df301c;
             }
        .full-width{
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button{
            color: #086288;
           border-color:  #147ea4;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        </style>
</head>
<body>
    <!--text,email,password,number,date,radio,checkbox,select,submit-->
<form>
    <br>
    <label for="full-name"> Names</label>
    <input class="full-width"type="text" required id="full-name" name="full name" placeholder="jane doe">
<br>
    <label for="email"> Email</label>
    <input class="full-width" type="email" required id="email" name="email" placeholder="jane@doe.com">
<br>
    <label for="password"> Password</label>
    <input class="full-width" type="password" required id="password" name="password" placeholder="***********">
<br>
    <label for="tel"> Telephone</label>
    <input class="full-width" type="tel" required id="tel" name="tel" placeholder="enter your number">
<br>
    <label for="weight"> Weight</label>
    <input class="full-width" type="number" min="30" max="250" step="0.01" required id="weight" name="weight" placeholder="enter your weight in kgs">
<br>
    <label for="DOB"> Date of Birth</label>
    <input class="full-width" type="date" min="1940-01-01" max="2008-12-31" required id="DOB" name="DOB" placeholder="enter your date of birth">
    
    <!-- must be the same forradio buttons-->
 <br>
 <label>select your gender</label>
 <br>
    <input type="radio" id="f" name="gender" value="female">
    <label for= "f"> female</label>
 <br>
    <input type="radio" id="m" name="gender" value="male">
    <label for="m"> male</label>
<hr>
<label>select your favourite food</label>
<br>
     <input type="checkbox" id="x" name="food">
    <label for="x"> burger</label>
    <br>
    <input type="checkbox" id="y" name="food">
    <label for="y"> pizza</label>
    <br>
    <input type="checkbox" id="z" name="food">
    <label for="z"> pasta</label>
    <br>
    <label>select your county(s)</label>
    <select class="full-width">
    <option value="1">mombasa</option>
    <option value="2">nairobi</option>
    <option value="3">kisumu</option>
    <option value="4">eldoret</option>
    <option value="5">nakuru</option></select>
''    <button>register</button>
</form>    
</body>
</html>
